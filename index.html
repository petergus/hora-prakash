<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hora Prakash</title>
  <meta name="description" content="Vedic Astrology" />
  <meta property="og:title" content="Hora Prakash" />
  <meta name="theme-color" content="#7f1d1d" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Hora" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <!-- Preload the large ephemeris files so the browser fetches them in parallel with JS -->
  <link rel="preload" href="/wasm/swisseph.wasm" as="fetch" crossorigin>
  <link rel="preload" href="/wasm/swisseph.data" as="fetch" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css" />
  <!-- Inline loader styles — render before any JS or external CSS -->
  <style>
    #app-loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 55vh;
      gap: 1.1rem;
    }
    .app-spinner {
      width: 38px;
      height: 38px;
      border: 3px solid #e2e8f0;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: hp-spin 0.75s linear infinite;
    }
    @keyframes hp-spin { to { transform: rotate(360deg); } }
    .app-loader-text {
      color: #94a3b8;
      font-size: 0.88rem;
      font-family: Inter, system-ui, -apple-system, sans-serif;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <div id="app-shell">
    <div id="drawer-scrim"></div>
    <aside id="app-sidebar">
      <div id="sidebar-brand">
        <h1><img src="/icon.svg" alt="" />Hora Prakash</h1>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-section-title">
          <span>Open People</span>
          <button id="btn-new-session" class="sidebar-add-btn" title="Open new profile" type="button" aria-label="New profile"></button>
        </div>
        <div id="sidebar-people"></div>
      </div>
      <nav class="sidebar-section" id="sidebar-global" aria-label="Global">
        <button class="side-item" data-nav="people" type="button">
          <span class="side-item-icon"></span>People
        </button>
        <button class="side-item" data-nav="compare" type="button">
          <span class="side-item-icon"></span>Compare
        </button>
        <button class="side-item" data-nav="buro" type="button" hidden>
          <span class="side-item-icon"></span>Admin
        </button>
      </nav>
      <div id="sidebar-footer"></div>
    </aside>
    <div id="workspace">
      <div id="mobile-topbar">
        <button id="btn-drawer" type="button" aria-label="Open menu"></button>
        <span id="topbar-brand">Hora Prakash</span>
        <span id="topbar-person"></span>
      </div>
      <div id="person-header" hidden></div>
      <nav id="tab-nav" aria-label="Pages">
        <button data-tab="input" class="tab-btn active">Birth Details</button>
        <button data-tab="chart" class="tab-btn" disabled>Chart</button>
        <button data-tab="reading" class="tab-btn" disabled>Reading</button>
        <button data-tab="dasha" class="tab-btn" disabled>Dasha</button>
        <button data-tab="transit" class="tab-btn" disabled>Transit</button>
        <button data-tab="calendar" class="tab-btn" disabled>Calendar</button>
        <button data-tab="panchang" class="tab-btn" disabled>Panchang</button>
        <button data-tab="strength" class="tab-btn" disabled>Strength</button>
        <button data-tab="export" class="tab-btn" disabled>Export</button>
      </nav>
      <main>
        <div id="app-loader">
          <div class="app-spinner"></div>
          <span class="app-loader-text">Loading ephemeris…</span>
        </div>
        <section id="tab-input" class="tab-panel active" style="display:none"></section>
        <section id="tab-people" class="tab-panel"></section>
        <section id="tab-chart" class="tab-panel"></section>
        <section id="tab-reading" class="tab-panel"></section>
        <section id="tab-dasha" class="tab-panel"></section>
        <section id="tab-panchang" class="tab-panel"></section>
        <section id="tab-strength" class="tab-panel"></section>
        <section id="tab-transit" class="tab-panel"></section>
        <section id="tab-calendar" class="tab-panel"></section>
        <section id="tab-compare" class="tab-panel"></section>
        <section id="tab-buro" class="tab-panel"></section>
        <section id="tab-export" class="tab-panel"></section>
      </main>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
