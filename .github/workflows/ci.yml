name: CI

# Test + production build on every push/PR. Deployment is manual via Firebase
# (`npm run deploy:firebase`), so this workflow never deploys — it only proves
# the app tests pass and the Vite build succeeds, catching regressions before a
# manual deploy ships them.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --legacy-peer-deps
      # Vite 8 (rolldown + lightningcss) ships platform-native bindings that
      # npm's optional-dependency resolution sometimes skips on CI, breaking the
      # build with MODULE_NOT_FOUND. Install them explicitly (one command — two
      # separate --no-save installs would prune each other).
      - run: npm install --no-save @rolldown/binding-linux-x64-gnu lightningcss-linux-x64-gnu
      - run: npm test
      - run: npm run build
